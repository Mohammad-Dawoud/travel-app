<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Plan a trip using a local synthetic travel catalog."
    />
    <title>Travel Guide App</title>
    <link rel="icon" href="/assets/logo.svg" type="image/svg+xml" />
  </head>
  <body>
    <header>
      <div class="logo">
        <img src="/assets/logo.svg" alt="Travel Guide App" />
      </div>
    </header>
    <main>
      <section class="form-input-outer-wrapper" aria-labelledby="journey-title">
        <form class="form-input-inner-wrapper" id="trip-form" novalidate>
          <h1 id="journey-title">Plan Your Journey</h1>
          <p class="fixture-note">
            Local demo with synthetic weather and images. Try Paris, Tokyo or
            Cairo.
          </p>
          <div class="basic-flexbox date-fields">
            <label
              >Departure date <input type="date" name="departureDate" required
            /></label>
            <label
              >Return date <input type="date" name="returnDate" required
            /></label>
          </div>
          <label
            >Destination
            <input
              type="text"
              name="destination"
              placeholder="e.g. Paris"
              required
              autocomplete="off"
          /></label>
          <button id="plan-trip" type="submit" class="generate-button">
            Plan My Trip
          </button>
          <p class="process-message" id="trip-status" role="status"></p>
          <p class="process-message" id="trip-error" role="alert"></p>
          <p id="offline-status" role="status"></p>
        </form>
      </section>
      <section id="trip-info" aria-labelledby="destination-name" hidden>
        <article id="data">
          <h2 id="destination-name" tabindex="-1"></h2>
          <img
            id="trip-image"
            class="trip-img"
            alt="Synthetic travel illustration"
            width="640"
            height="320"
          />
          <dl class="trip-details">
            <div>
              <dt>Departure</dt>
              <dd id="depart-date"></dd>
            </div>
            <div>
              <dt>Return</dt>
              <dd id="return-date"></dd>
            </div>
            <div>
              <dt>Days until departure</dt>
              <dd id="countdown"></dd>
            </div>
            <div>
              <dt>Trip length</dt>
              <dd id="duration"></dd>
            </div>
          </dl>
          <p id="weather"></p>
          <p id="warnings" role="status"></p>
          <div class="trip-actions">
            <button type="button" id="close-trip">Close trip</button>
            <button type="button" id="print-trip">Print trip</button>
          </div>
        </article>
      </section>
    </main>
    <footer>
      <div class="footer-wrapper">
        <p>Travel Guide App • MoDawood • © 2025</p>
      </div>
    </footer>
  </body>
</html>
